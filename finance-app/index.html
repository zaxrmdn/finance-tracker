<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal & Business Finance Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white shadow-md rounded-2xl p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">💰 Finance Tracker</h1>
                <p class="text-slate-500 text-sm">Kelola keuangan pribadi & bisnis dalam satu tempat</p>
            </div>
            <div id="total-balance" class="text-right">
                <span class="text-xs text-slate-400 block">Total Saldo</span>
                <span class="text-xl font-bold text-emerald-600">Rp 0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Form Tambah Transaksi -->
            <div class="bg-white shadow-md rounded-2xl p-6 md:col-span-1">
                <h2 class="text-lg font-semibold text-slate-700 mb-4">Tambah Transaksi</h2>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Tipe</label>
                        <select id="type" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="income">Pemasukan (Income)</option>
                            <option value="expense">Pengeluaran (Expense)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Kategori</label>
                        <input type="text" id="category" placeholder="Cth: Gaji, Makanan, Sewa" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="Cth: 50000" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan (Opsional)</label>
                        <input type="text" id="description" placeholder="Cth: Makan siang klien" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition text-sm">Simpan Transaksi</button>
                </form>
            </div>

            <!-- Daftar Transaksi -->
            <div class="bg-white shadow-md rounded-2xl p-6 md:col-span-2">
                <h2 class="text-lg font-semibold text-slate-700 mb-4">Riwayat Transaksi</h2>
                <div class="overflow-x-auto max-h-[400px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-xs text-slate-400 uppercase">
                                <th class="py-2 px-2">Kategori</th>
                                <th class="py-2 px-2">Keterangan</th>
                                <th class="py-2 px-2">Jumlah</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-table-body" class="text-sm text-slate-600 divide-y">
                            <!-- Data akan dimuat melalui JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Skrip JavaScript Frontend -->
    <script>
        const form = document.getElementById('transaction-form');
        const tableBody = document.getElementById('transaction-table-body');
        const totalBalanceEl = document.getElementById('total-balance').querySelector('span:nth-child(2)');

        async function fetchTransactions() {
            try {
                const res = await fetch('/api/transactions');
                const data = await res.json();
                const transactions = data.transactions;

                tableBody.innerHTML = '';
                let balance = 0;

                if (transactions.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-slate-400">Belum ada transaksi.</td></tr>`;
                    totalBalanceEl.innerText = 'Rp 0';
                    return;
                }

                transactions.forEach(tx => {
                    const isIncome = tx.type === 'income';
                    const amountFormatted = Number(tx.amount).toLocaleString('id-ID');
                    
                    if (isIncome) {
                        balance += tx.amount;
                    } else {
                        balance -= tx.amount;
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="py-3 px-2 font-medium text-slate-700">
                            <span class="inline-block px-2 py-0.5 text-xs rounded-full ${isIncome ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} mb-1">${tx.type.toUpperCase()}</span><br>
                            ${tx.category}
                        </td>
                        <td class="py-3 px-2 text-slate-500 text-xs">${tx.description || '-'}</td>
                        <td class="py-3 px-2 font-semibold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                            ${isIncome ? '+' : '-'} Rp ${amountFormatted}
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                totalBalanceEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
                totalBalanceEl.className = `text-xl font-bold ${balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
            } catch (err) {
                console.error('Gagal mengambil data:', err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;

            try {
                const res = await fetch('/api/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, category, amount, description })
                });

                if (res.ok) {
                    form.reset();
                    fetchTransactions();
                } else {
                    alert('Gagal menyimpan transaksi.');
                }
            } catch (err) {
                console.error('Terjadi kesalahan:', err);
            }
        });

        // Muat data saat halaman dibuka
        fetchTransactions();
    </script>
</body>
</html>
