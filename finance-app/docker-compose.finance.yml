version: '3.8'

networks:
  app-net:
    name: npm_app-net
    external: true

services:
  finance-api:
    build: .
    container_name: finance-tracker-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - finance_data:/app   
    networks:
      - app-net

volumes:
  finance_data:        
