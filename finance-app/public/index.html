<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal & Business Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div id="app" class="max-w-6xl mx-auto p-4 md:p-8">
        
        <!-- Bagian Login & Register -->
        <div id="login-section" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mt-10">
            <div class="flex border-b mb-6">
                <button id="tab-login-btn" onclick="switchAuthTab('login')" class="w-1/2 pb-2 font-bold text-blue-600 border-b-2 border-blue-600 text-center text-sm">Login</button>
                <button id="tab-register-btn" onclick="switchAuthTab('register')" class="w-1/2 pb-2 font-semibold text-gray-400 text-center text-sm">Daftar</button>
            </div>

            <form id="auth-form" class="space-y-4">
                <h2 id="auth-form-title" class="text-xl font-bold mb-4 text-center text-gray-700">Masuk Akun</h2>
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="auth-username" required class="w-full border rounded-lg p-2 focus:ring focus:ring-blue-300 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full border rounded-lg p-2 focus:ring focus:ring-blue-300 text-sm">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Masuk</button>
            </form>
            <p id="auth-message" class="text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- Bagian Dashboard Utama -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
                <div>
                    <h1 class="text-xl font-bold text-gray-700">💰 Financial Dashboard & Goals</h1>
                    <p class="text-xs text-gray-500">Halo, <span id="user-display" class="font-semibold text-blue-600"></span></p>
                </div>
                <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">Logout</button>
            </div>

            <!-- Filter & Ekspor -->
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium">Filter Bulan:</label>
                    <input type="month" id="filter-month" class="border rounded-lg p-2 text-sm">
                    <button id="reset-filter" class="bg-gray-200 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">Reset</button>
                </div>
                <button id="export-csv" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 font-medium">📥 Unduh Laporan CSV</button>
            </div>

            <!-- Ringkasan Saldo & Grafik -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                    <h3 class="font-bold text-lg text-gray-700">Ringkasan Saldo</h3>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-green-50 p-3 rounded-lg">
                            <p class="text-xs text-green-600 font-semibold">Pemasukan</p>
                            <p id="total-income" class="text-lg font-bold text-green-700">Rp 0</p>
                        </div>
                        <div class="bg-red-50 p-3 rounded-lg">
                            <p class="text-xs text-red-600 font-semibold">Pengeluaran</p>
                            <p id="total-expense" class="text-lg font-bold text-red-700">Rp 0</p>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-lg">
                            <p class="text-xs text-blue-600 font-semibold">Sisa Saldo</p>
                            <p id="total-balance" class="text-lg font-bold text-blue-700">Rp 0</p>
                        </div>
                    </div>

                    <!-- Form Tambah Transaksi -->
                    <form id="transaction-form" class="space-y-3 pt-4 border-t">
                        <input type="hidden" id="tx-edit-id">
                        <h4 id="tx-form-title" class="font-semibold text-sm text-gray-600">Tambah Transaksi</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="tx-type" class="border rounded-lg p-2 text-sm">
                                <option value="income">Pemasukan</option>
                                <option value="expense" selected>Pengeluaran</option>
                            </select>
                            <select id="tx-scope" class="border rounded-lg p-2 text-sm">
                                <option value="Pribadi">Pribadi</option>
                                <option value="Bisnis">Bisnis</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="tx-category" placeholder="Kategori" required class="border rounded-lg p-2 text-sm">
                            <input type="number" id="tx-amount" placeholder="Nominal (Rp)" required class="border rounded-lg p-2 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="tx-desc" placeholder="Deskripsi" class="border rounded-lg p-2 text-sm">
                            <input type="date" id="tx-date" required class="border rounded-lg p-2 text-sm">
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" id="tx-submit-btn" class="flex-1 bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Simpan Transaksi</button>
                            <button type="button" id="tx-cancel-btn" onclick="resetTxForm()" class="hidden bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-sm">Batal</button>
                        </div>
                    </form>
                </div>

                <!-- Grafik Chart.js -->
                <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col justify-center items-center">
                    <h3 class="font-bold text-lg text-gray-700 mb-2">Grafik Pengeluaran</h3>
                    <div class="w-full max-w-xs h-64">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- TABUNGAN & HUTANG -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Panel Tabungan -->
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                    <h3 class="font-bold text-lg text-gray-700">🎯 Target Tabungan (Saving Goals)</h3>
                    <form id="saving-form" class="space-y-2">
                        <input type="text" id="sav-title" placeholder="Nama Target (Cth: Beli Laptop)" required class="w-full border rounded-lg p-2 text-sm">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="sav-target" placeholder="Target Nominal (Rp)" required class="border rounded-lg p-2 text-sm">
                            <input type="date" id="sav-deadline" class="border rounded-lg p-2 text-sm">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Tambah Target</button>
                    </form>
                    <div id="savings-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
                </div>

                <!-- Panel Hutang & Piutang -->
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                    <h3 class="font-bold text-lg text-gray-700">🤝 Catatan Hutang & Piutang</h3>
                    <form id="debt-form" class="space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="debt-name" placeholder="Nama Orang" required class="border rounded-lg p-2 text-sm">
                            <select id="debt-type" class="border rounded-lg p-2 text-sm">
                                <option value="piutang">Piutang (Dipinjam Orang)</option>
                                <option value="hutang">Hutang (Anda Meminjam)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="debt-amount" placeholder="Nominal (Rp)" required class="border rounded-lg p-2 text-sm">
                            <input type="date" id="debt-due" class="border rounded-lg p-2 text-sm">
                        </div>
                        <button type="submit" class="w-full bg-amber-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-amber-700">Simpan Catatan</button>
                    </form>
                    <div id="debts-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <!-- Tabel Riwayat Transaksi -->
            <div class="bg-white p-6 rounded-xl shadow-sm overflow-x-auto">
                <h3 class="font-bold text-lg text-gray-700 mb-4">Riwayat Transaksi</h3>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-sm text-gray-600">
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Lingkup</th>
                            <th class="p-3">Kategori</th>
                            <th class="p-3">Deskripsi</th>
                            <th class="p-3">Nominal</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body" class="text-sm"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Frontend -->
    <script>
        let transactionsData = [];
        let expenseChart = null;
        let authMode = 'login';

        function switchAuthTab(mode) {
            authMode = mode;
            const titleEl = document.getElementById('auth-form-title');
            const submitBtn = document.getElementById('auth-submit-btn');
            const loginBtn = document.getElementById('tab-login-btn');
            const regBtn = document.getElementById('tab-register-btn');
            const msgEl = document.getElementById('auth-message');
            msgEl.classList.add('hidden');

            if (mode === 'login') {
                titleEl.innerText = 'Masuk Akun';
                submitBtn.innerText = 'Masuk';
                submitBtn.className = 'w-full bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-blue-700';
                loginBtn.className = "w-1/2 pb-2 font-bold text-blue-600 border-b-2 border-blue-600 text-center text-sm";
                regBtn.className = "w-1/2 pb-2 font-semibold text-gray-400 text-center text-sm";
            } else {
                titleEl.innerText = 'Daftar Akun Baru';
                submitBtn.innerText = 'Daftar';
                submitBtn.className = 'w-full bg-green-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-green-700';
                regBtn.className = "w-1/2 pb-2 font-bold text-green-600 border-b-2 border-green-600 text-center text-sm";
                loginBtn.className = "w-1/2 pb-2 font-semibold text-gray-400 text-center text-sm";
            }
        }

        async function checkSession() {
            try {
                const res = await fetch('/api/check-session');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('user-display').innerText = data.username;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    loadAllData();
                } else {
                    document.getElementById('login-section').classList.remove('hidden');
                    document.getElementById('dashboard-section').classList.add('hidden');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadAllData() {
            await fetchTransactions();
            await fetchSavings();
            await fetchDebts();
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
            const msgEl = document.getElementById('auth-message');

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            msgEl.classList.remove('hidden');
            if (res.ok) {
                msgEl.className = "text-green-600 text-sm mt-3 text-center";
                msgEl.innerText = data.message;
                if (authMode === 'register') {
                    setTimeout(() => switchAuthTab('login'), 1200);
                } else {
                    checkSession();
                }
            } else {
                msgEl.className = "text-red-500 text-sm mt-3 text-center";
                msgEl.innerText = data.error;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            checkSession();
        });

        async function fetchTransactions() {
            const month = document.getElementById('filter-month').value;
            let url = '/api/transactions';
            if (month) url += `?month=${month}`;

            const res = await fetch(url);
            if (res.ok) {
                transactionsData = await res.json();
                renderTransactions();
            }
        }

        function renderTransactions() {
            let totalIncome = 0;
            let totalExpense = 0;
            const tbody = document.getElementById('transaction-table-body');
            tbody.innerHTML = '';
            let categoryMap = {};

            transactionsData.forEach(tx => {
                if (tx.type === 'income') totalIncome += tx.amount;
                else {
                    totalExpense += tx.amount;
                    categoryMap[tx.category] = (categoryMap[tx.category] || 0) + tx.amount;
                }

                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3">${tx.date}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold ${tx.scope === 'Bisnis' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700'}">${tx.scope || 'Pribadi'}</span></td>
                    <td class="p-3 font-medium">${tx.category}</td>
                    <td class="p-3 text-gray-500">${tx.description || '-'}</td>
                    <td class="p-3 font-semibold ${tx.type === 'income' ? 'text-green-600' : 'text-red-600'}">
                        ${tx.type === 'income' ? '+' : '-'} Rp ${tx.amount.toLocaleString('id-ID')}
                    </td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="editTransaction(${tx.id}, '${tx.type}', '${tx.scope || 'Pribadi'}', '${tx.category}', ${tx.amount}, '${tx.description || ''}', '${tx.date}')" class="text-blue-500 hover:text-blue-700 text-xs bg-blue-50 px-2 py-1 rounded">Edit</button>
                        <button onclick="deleteTransaction(${tx.id})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-income').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
            document.getElementById('total-expense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
            document.getElementById('total-balance').innerText = `Rp ${(totalIncome - totalExpense).toLocaleString('id-ID')}`;

            updateChart(categoryMap);
        }

        document.getElementById('transaction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('tx-edit-id').value;
            const body = {
                type: document.getElementById('tx-type').value,
                scope: document.getElementById('tx-scope').value,
                category: document.getElementById('tx-category').value,
                amount: parseFloat(document.getElementById('tx-amount').value),
                description: document.getElementById('tx-desc').value,
                date: document.getElementById('tx-date').value
            };

            const url = id ? `/api/transactions/${id}` : '/api/transactions';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                resetTxForm();
                loadAllData();
            }
        });

        function editTransaction(id, type, scope, category, amount, description, date) {
            document.getElementById('tx-edit-id').value = id;
            document.getElementById('tx-type').value = type;
            document.getElementById('tx-scope').value = scope;
            document.getElementById('tx-category').value = category;
            document.getElementById('tx-amount').value = amount;
            document.getElementById('tx-desc').value = description === 'null' ? '' : description;
            document.getElementById('tx-date').value = date;

            document.getElementById('tx-form-title').innerText = 'Edit Transaksi';
            document.getElementById('tx-submit-btn').innerText = 'Perbarui Transaksi';
            document.getElementById('tx-submit-btn').className = 'flex-1 bg-amber-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-amber-700';
            document.getElementById('tx-cancel-btn').classList.remove('hidden');
        }

        function resetTxForm() {
            document.getElementById('transaction-form').reset();
            document.getElementById('tx-edit-id').value = '';
            document.getElementById('tx-form-title').innerText = 'Tambah Transaksi';
            document.getElementById('tx-submit-btn').innerText = 'Simpan Transaksi';
            document.getElementById('tx-submit-btn').className = 'flex-1 bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-blue-700';
            document.getElementById('tx-cancel-btn').classList.add('hidden');
            document.getElementById('tx-date').valueAsDate = new Date();
        }

        async function deleteTransaction(id) {
            if (confirm('Hapus transaksi ini?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                loadAllData();
            }
        }

        async function fetchSavings() {
            const res = await fetch('/api/savings');
            const savings = await res.json();
            const listEl = document.getElementById('savings-list');
            listEl.innerHTML = '';

            savings.forEach(sav => {
                const percent = Math.min(100, Math.round((sav.current_amount / sav.target_amount) * 100));
                const div = document.createElement('div');
                div.className = 'p-3 border rounded-lg bg-gray-50 space-y-1';
                div.innerHTML = `
                    <div class="flex justify-between text-sm font-semibold">
                        <span>${sav.title}</span>
                        <span>Rp ${sav.current_amount.toLocaleString('id-ID')} / ${sav.target_amount.toLocaleString('id-ID')}</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div class="bg-indigo-600 h-2.5 rounded-full" style="width: ${percent}%"></div>
                    </div>
                    <div class="flex justify-between items-center text-xs text-gray-500 pt-1">
                        <span>Progres: ${percent}%</span>
                        <div class="space-x-1">
                            <button onclick="depositSaving(${sav.id})" class="bg-green-100 text-green-700 px-2 py-1 rounded">Setor</button>
                            <button onclick="deleteSaving(${sav.id})" class="bg-red-100 text-red-700 px-2 py-1 rounded">Hapus</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        document.getElementById('saving-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/savings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('sav-title').value,
                    target_amount: parseFloat(document.getElementById('sav-target').value),
                    deadline: document.getElementById('sav-deadline').value
                })
            });
            e.target.reset();
            fetchSavings();
        });

        async function depositSaving(id) {
            const amt = prompt('Masukkan jumlah setoran tabungan (Rp):');
            if (amt && !isNaN(amt)) {
                await fetch(`/api/savings/${id}/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: parseFloat(amt) })
                });
                fetchSavings();
            }
        }

        async function deleteSaving(id) {
            if (confirm('Hapus target tabungan ini?')) {
                await fetch(`/api/savings/${id}`, { method: 'DELETE' });
                fetchSavings();
            }
        }

        async function fetchDebts() {
            const res = await fetch('/api/debts');
            const debts = await res.json();
            const listEl = document.getElementById('debts-list');
            listEl.innerHTML = '';

            debts.forEach(d => {
                const div = document.createElement('div');
                div.className = 'p-3 border rounded-lg bg-gray-50 flex justify-between items-center text-sm';
                div.innerHTML = `
                    <div>
                        <p class="font-semibold">${d.person_name} <span class="text-xs px-2 py-0.5 rounded ${d.type === 'piutang' ? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}">${d.type.toUpperCase()}</span></p>
                        <p class="text-xs text-gray-500">Rp ${d.amount.toLocaleString('id-ID')} - <span class="${d.status === 'Lunas' ? 'text-green-600 font-semibold' : 'text-red-500'}">${d.status}</span></p>
                    </div>
                    <div class="space-x-1">
                        ${d.status !== 'Lunas' ? `<button onclick="payDebt(${d.id})" class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded">Lunasi</button>` : ''}
                        <button onclick="deleteDebt(${d.id})" class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded">Hapus</button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        document.getElementById('debt-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/debts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    person_name: document.getElementById('debt-name').value,
                    type: document.getElementById('debt-type').value,
                    amount: parseFloat(document.getElementById('debt-amount').value),
                    due_date: document.getElementById('debt-due').value
                })
            });
            e.target.reset();
            fetchDebts();
        });

        async function payDebt(id) {
            await fetch(`/api/debts/${id}/pay`, { method: 'POST' });
            fetchDebts();
        }

        async function deleteDebt(id) {
            if (confirm('Hapus catatan hutang ini?')) {
                await fetch(`/api/debts/${id}`, { method: 'DELETE' });
                fetchDebts();
            }
        }

        function updateChart(categoryMap) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categoryMap);
            const data = Object.values(categoryMap);

            if (expenseChart) expenseChart.destroy();
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length > 0 ? labels : ['Belum ada pengeluaran'],
                    datasets: [{
                        data: data.length > 0 ? data : [1],
                        backgroundColor: ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#8b5cf6', '#ec4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        document.getElementById('filter-month').addEventListener('change', fetchTransactions);
        document.getElementById('reset-filter').addEventListener('click', () => {
            document.getElementById('filter-month').value = '';
            fetchTransactions();
        });

        document.getElementById('export-csv').addEventListener('click', () => {
            if (transactionsData.length === 0) return alert('Tidak ada data.');
            let csvContent = "data:text/csv;charset=utf-8,Tanggal,Lingkup,Kategori,Tipe,Nominal,Deskripsi\r\n";
            transactionsData.forEach(tx => {
                csvContent += [tx.date, tx.scope || 'Pribadi', tx.category, tx.type, tx.amount, `"${tx.description || ''}"`].join(",") + "\r\n";
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `laporan_keuangan.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('tx-date').valueAsDate = new Date();
        checkSession();
    </script>
</body>
</html>
