<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal & Business Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">
    <!-- HALAMAN OTENTIKASI (LOGIN / REGISTER) -->
    <div id="auth-section" class="max-w-md mx-auto bg-white shadow-lg rounded-2xl p-8 mt-16">
        <h2 id="auth-title" class="text-2xl font-bold text-slate-800 mb-2 text-center">🔐 Login Finance Tracker</h2>
        <p id="auth-subtitle" class="text-slate-400 text-xs text-center mb-6">Silakan masuk dengan akun Anda</p>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Username</label>
                <input type="text" id="username" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Password</label>
                <input type="password" id="password" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition text-sm">Masuk</button>
            <p id="auth-message" class="text-xs text-center mt-2 hidden"></p>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <span id="toggle-text">Belum punya akun?</span>
            <button onclick="toggleAuthMode()" id="toggle-btn" class="text-blue-600 font-semibold ml-1 hover:underline">Daftar di sini</button>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI -->
    <div id="app-section" class="max-w-4xl mx-auto hidden">
        <div class="bg-white shadow-md rounded-2xl p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">💰 Finance Tracker</h1>
                <p class="text-slate-500 text-sm">Halo, <span id="user-display" class="font-semibold text-blue-600"></span></p>
            </div>
            <div class="flex items-center gap-4">
                <div id="total-balance" class="text-right">
                    <span class="text-xs text-slate-400 block">Total Saldo</span>
                    <span class="text-xl font-bold text-emerald-600">Rp 0</span>
                </div>
                <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Keluar</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Form Tambah / Edit Transaksi -->
            <div class="bg-white shadow-md rounded-2xl p-6 md:col-span-1">
                <h2 id="form-title" class="text-lg font-semibold text-slate-700 mb-4">Tambah Transaksi</h2>
                <form id="transaction-form" class="space-y-4">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Tipe</label>
                        <select id="type" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="income">Pemasukan (Income)</option>
                            <option value="expense">Pengeluaran (Expense)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Kategori</label>
                        <input type="text" id="category" placeholder="Cth: Gaji, Makanan" required class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="Cth: 50000" required class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan</label>
                        <input type="text" id="description" placeholder="Cth: Makan siang" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="submit-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition text-sm">Simpan</button>
                        <button type="button" id="cancel-edit" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-sm transition">Batal</button>
                    </div>
                </form>
            </div>

            <!-- Daftar Transaksi -->
            <div class="bg-white shadow-md rounded-2xl p-6 md:col-span-2">
                <h2 class="text-lg font-semibold text-slate-700 mb-4">Riwayat Transaksi</h2>
                <div class="overflow-x-auto max-h-[420px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-xs text-slate-400 uppercase">
                                <th class="py-2 px-2">Kategori</th>
                                <th class="py-2 px-2">Keterangan</th>
                                <th class="py-2 px-2">Jumlah</th>
                                <th class="py-2 px-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-table-body" class="text-sm text-slate-600 divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('userId') || null;
        let currentUsername = localStorage.getItem('username') || null;
        let isRegisterMode = false;

        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');
        const authBtn = document.getElementById('auth-btn');
        const authMessage = document.getElementById('auth-message');
        const toggleText = document.getElementById('toggle-text');
        const toggleBtn = document.getElementById('toggle-btn');

        const transactionForm = document.getElementById('transaction-form');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const editIdInput = document.getElementById('edit-id');
        const tableBody = document.getElementById('transaction-table-body');
        const totalBalanceEl = document.getElementById('total-balance').querySelector('span:nth-child(2)');

        function checkAuth() {
            if (currentUser) {
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                document.getElementById('user-display').innerText = currentUsername;
                fetchTransactions();
            } else {
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            authMessage.classList.add('hidden');
            if (isRegisterMode) {
                authTitle.innerText = '📝 Daftar Akun Baru';
                authSubtitle.innerText = 'Buat akun personal Anda sendiri';
                authBtn.innerText = 'Daftar';
                toggleText.innerText = 'Sudah punya akun?';
                toggleBtn.innerText = 'Masuk di sini';
            } else {
                authTitle.innerText = '🔐 Login Finance Tracker';
                authSubtitle.innerText = 'Silakan masuk dengan akun Anda';
                authBtn.innerText = 'Masuk';
                toggleText.innerText = 'Belum punya akun?';
                toggleBtn.innerText = 'Daftar di sini';
            }
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const endpoint = isRegisterMode ? '/api/register' : '/api/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    if (isRegisterMode) {
                        alert(data.message);
                        toggleAuthMode();
                        authForm.reset();
                    } else {
                        localStorage.setItem('userId', data.userId);
                        localStorage.setItem('username', data.username);
                        currentUser = data.userId;
                        currentUsername = data.username;
                        checkAuth();
                    }
                } else {
                    authMessage.innerText = data.error;
                    authMessage.className = 'text-rose-500 text-xs text-center mt-2';
                    authMessage.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        });

        function logout() {
            localStorage.clear();
            currentUser = null;
            currentUsername = null;
            checkAuth();
        }

        async function fetchTransactions() {
            try {
                const res = await fetch(`/api/transactions?userId=${currentUser}`);
                const data = await res.json();
                const transactions = data.transactions;

                tableBody.innerHTML = '';
                let balance = 0;

                if (transactions.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400">Belum ada transaksi.</td></tr>`;
                    totalBalanceEl.innerText = 'Rp 0';
                    return;
                }

                transactions.forEach(tx => {
                    const isIncome = tx.type === 'income';
                    const amountFormatted = Number(tx.amount).toLocaleString('id-ID');
                    if (isIncome) balance += tx.amount;
                    else balance -= tx.amount;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="py-3 px-2 font-medium text-slate-700">
                            <span class="inline-block px-2 py-0.5 text-xs rounded-full ${isIncome ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'} mb-1">${tx.type.toUpperCase()}</span><br>
                            ${tx.category}
                        </td>
                        <td class="py-3 px-2 text-slate-500 text-xs">${tx.description || '-'}</td>
                        <td class="py-3 px-2 font-semibold ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                            ${isIncome ? '+' : '-'} Rp ${amountFormatted}
                        </td>
                        <td class="py-3 px-2 text-center space-x-2">
                            <button onclick="editTransaction(${tx.id}, '${tx.type}', '${tx.category}', ${tx.amount}, '${tx.description || ''}')" class="text-blue-600 hover:text-blue-800 text-xs font-medium">Edit</button>
                            <button onclick="deleteTransaction(${tx.id})" class="text-rose-600 hover:text-rose-800 text-xs font-medium">Hapus</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });

                totalBalanceEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
                totalBalanceEl.className = `text-xl font-bold ${balance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;
            } catch (err) {
                console.error('Gagal memuat transaksi:', err);
            }
        }

        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = editIdInput.value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value;

            const url = id ? `/api/transactions/${id}` : '/api/transactions';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser, type, category, amount, description })
                });

                if (res.ok) {
                    resetForm();
                    fetchTransactions();
                } else {
                    alert('Gagal menyimpan transaksi.');
                }
            } catch (err) {
                console.error(err);
            }
        });

        function editTransaction(id, type, category, amount, description) {
            editIdInput.value = id;
            document.getElementById('type').value = type;
            document.getElementById('category').value = category;
            document.getElementById('amount').value = amount;
            document.getElementById('description').value = description === 'null' ? '' : description;

            formTitle.innerText = 'Edit Transaksi';
            submitBtn.innerText = 'Perbarui';
            submitBtn.className = 'flex-1 bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 rounded-lg transition text-sm';
            cancelEditBtn.classList.remove('hidden');
        }

        function resetForm() {
            transactionForm.reset();
            editIdInput.value = '';
            formTitle.innerText = 'Tambah Transaksi';
            submitBtn.innerText = 'Simpan';
            submitBtn.className = 'flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition text-sm';
            cancelEditBtn.classList.add('hidden');
        }

        async function deleteTransaction(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) return;
            try {
                const res = await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchTransactions();
                } else {
                    alert('Gagal menghapus transaksi.');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Cek autentikasi saat pertama kali dibuka
        checkAuth();
    </script>
</body>
</html>
