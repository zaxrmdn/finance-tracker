<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal & Business Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js untuk Grafik Visualisasi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Container Utama -->
    <div id="app" class="max-w-5xl mx-auto p-4 md:p-8">
        
        <!-- Bagian Login (Tampil jika belum login) -->
        <div id="login-section" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Login Keuangan</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" required class="w-full border rounded-lg p-2 focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full border rounded-lg p-2 focus:ring focus:ring-blue-300">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-lg font-semibold hover:bg-blue-700">Masuk</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- Bagian Dashboard (Tampil setelah login) -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm">
                <h1 class="text-xl font-bold text-gray-700">💰 Financial Dashboard</h1>
                <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">Logout</button>
            </div>

            <!-- Filter Bulan & Ekspor CSV -->
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <label class="text-sm font-medium">Filter Bulan:</label>
                    <input type="month" id="filter-month" class="border rounded-lg p-2 text-sm">
                    <button id="reset-filter" class="bg-gray-200 px-3 py-2 rounded-lg text-sm hover:bg-gray-300">Reset</button>
                </div>
                <button id="export-csv" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700 font-medium">📥 Unduh Laporan CSV</button>
            </div>

            <!-- Ringkasan Saldo & Grafik -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Kartu Informasi Saldo -->
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                    <h3 class="font-bold text-lg text-gray-700">Ringkasan Finansial</h3>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-green-50 p-3 rounded-lg">
                            <p class="text-xs text-green-600 font-semibold">Pemasukan</p>
                            <p id="total-income" class="text-lg font-bold text-green-700">Rp 0</p>
                        </div>
                        <div class="bg-red-50 p-3 rounded-lg">
                            <p class="text-xs text-red-600 font-semibold">Pengeluaran</p>
                            <p id="total-expense" class="text-lg font-bold text-red-700">Rp 0</p>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-lg">
                            <p class="text-xs text-blue-600 font-semibold">Sisa Saldo</p>
                            <p id="total-balance" class="text-lg font-bold text-blue-700">Rp 0</p>
                        </div>
                    </div>

                    <!-- Form Tambah Transaksi -->
                    <form id="transaction-form" class="space-y-3 pt-4 border-t">
                        <h4 class="font-semibold text-sm text-gray-600">Tambah Transaksi Baru</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="tx-type" class="border rounded-lg p-2 text-sm">
                                <option value="income">Pemasukan</option>
                                <option value="expense" selected>Pengeluaran</option>
                            </select>
                            <select id="tx-scope" class="border rounded-lg p-2 text-sm">
                                <option value="Pribadi">Pribadi</option>
                                <option value="Bisnis">Bisnis</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="tx-category" placeholder="Kategori (cth: Makanan)" required class="border rounded-lg p-2 text-sm">
                            <input type="number" id="tx-amount" placeholder="Nominal (Rp)" required class="border rounded-lg p-2 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="tx-desc" placeholder="Deskripsi (Opsional)" class="border rounded-lg p-2 text-sm">
                            <input type="date" id="tx-date" required class="border rounded-lg p-2 text-sm">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Simpan Transaksi</button>
                    </form>
                </div>

                <!-- Grafik Chart.js -->
                <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col justify-center items-center">
                    <h3 class="font-bold text-lg text-gray-700 mb-2">Grafik Pengeluaran per Kategori</h3>
                    <div class="w-full max-w-xs h-64">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Tabel Riwayat Transaksi -->
            <div class="bg-white p-6 rounded-xl shadow-sm overflow-x-auto">
                <h3 class="font-bold text-lg text-gray-700 mb-4">Riwayat Transaksi</h3>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-50 text-sm text-gray-600">
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Lingkup</th>
                            <th class="p-3">Kategori</th>
                            <th class="p-3">Deskripsi</th>
                            <th class="p-3">Nominal</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body" class="text-sm">
                        <!-- Data dimasukkan via Javascript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Logika Frontend & Chart -->
    <script>
        let transactionsData = [];
        let expenseChart = null;

        // Cek Status Login saat halaman dimuat
        async function fetchTransactions() {
            const month = document.getElementById('filter-month').value;
            let url = '/api/transactions';
            if (month) url += `?month=${month}`;

            const res = await fetch(url);
            if (res.status === 401) {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                return;
            }
            
            transactionsData = await res.json();
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            renderDashboard();
        }

        // Render Data ke UI dan Chart
        function renderDashboard() {
            let totalIncome = 0;
            let totalExpense = 0;
            const tbody = document.getElementById('transaction-table-body');
            tbody.innerHTML = '';

            let categoryMap = {};

            transactionsData.forEach(tx => {
                if (tx.type === 'income') totalIncome += tx.amount;
                else {
                    totalExpense += tx.amount;
                    categoryMap[tx.category] = (categoryMap[tx.category] || 0) + tx.amount;
                }

                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3">${tx.date}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold ${tx.scope === 'Bisnis' ? 'bg-purple-100 text-purple-700' : 'bg-gray-100 text-gray-700'}">${tx.scope}</span></td>
                    <td class="p-3 font-medium">${tx.category}</td>
                    <td class="p-3 text-gray-500">${tx.description || '-'}</td>
                    <td class="p-3 font-semibold ${tx.type === 'income' ? 'text-green-600' : 'text-red-600'}">
                        ${tx.type === 'income' ? '+' : '-'} Rp ${tx.amount.toLocaleString('id-ID')}
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="deleteTransaction(${tx.id})" class="text-red-500 hover:text-red-700 text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-income').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
            document.getElementById('total-expense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
            document.getElementById('total-balance').innerText = `Rp ${(totalIncome - totalExpense).toLocaleString('id-ID')}`;

            updateChart(categoryMap);
        }

        // Update Grafik Chart.js
        function updateChart(categoryMap) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const labels = Object.keys(categoryMap);
            const data = Object.values(categoryMap);

            if (expenseChart) expenseChart.destroy();

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length > 0 ? labels : ['Belum ada pengeluaran'],
                    datasets: [{
                        data: data.length > 0 ? data : [1],
                        backgroundColor: ['#ef4444', '#f97316', '#eab308', '#3b82f6', '#8b5cf6', '#ec4899']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                fetchTransactions();
            } else {
                const err = await res.json();
                const errEl = document.getElementById('login-error');
                errEl.innerText = err.error;
                errEl.classList.remove('hidden');
            }
        });

        // Logout Handler
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            fetchTransactions();
        });

        // Tambah Transaksi Handler
        document.getElementById('transaction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                type: document.getElementById('tx-type').value,
                scope: document.getElementById('tx-scope').value,
                category: document.getElementById('tx-category').value,
                amount: parseFloat(document.getElementById('tx-amount').value),
                description: document.getElementById('tx-desc').value,
                date: document.getElementById('tx-date').value
            };

            const res = await fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                document.getElementById('transaction-form').reset();
                document.getElementById('tx-date').valueAsDate = new Date();
                fetchTransactions();
            }
        });

        // Hapus Transaksi
        async function deleteTransaction(id) {
            if (confirm('Yakin ingin menghapus transaksi ini?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                fetchTransactions();
            }
        }

        // Filter Bulan & Reset
        document.getElementById('filter-month').addEventListener('change', fetchTransactions);
        document.getElementById('reset-filter').addEventListener('click', () => {
            document.getElementById('filter-month').value = '';
            fetchTransactions();
        });

        // Ekspor CSV Handler
        document.getElementById('export-csv').addEventListener('click', () => {
            if (transactionsData.length === 0) {
                alert('Tidak ada data untuk diekspor.');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,Tanggal,Lingkup,Kategori,Tipe,Nominal,Deskripsi\r\n";
            transactionsData.forEach(tx => {
                let row = [tx.date, tx.scope, tx.category, tx.type, tx.amount, `"${tx.description || ''}"`].join(",");
                csvContent += row + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `laporan_keuangan_${document.getElementById('filter-month').value || 'semua'}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Set tanggal default ke hari ini
        document.getElementById('tx-date').valueAsDate = new Date();
        fetchTransactions();
    </script>
</body>
</html>
